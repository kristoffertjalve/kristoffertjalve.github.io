<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Girlfriend Is an Artist</title>
  <!-- Link the CSS file here -->
  <link rel="stylesheet" href="styles.css">

<!-- Open Graph meta tags -->
  <meta property="og:title" content="My Girlfriend Is an Artist">
  <meta property="og:description" content="A tribute to Ana Andersen Santl. Click the photo to view the next image from her Are.na channel. The texts are written by me, Kristoffer.">
  <meta property="og:image" content="https://d2w9rnfcy7mm78.cloudfront.net/28056917/original_e64a29f872dde183c362155091b9bcc3.jpg?1715510665?bc=0"> <!-- Replace with the URL of your preview image -->
  <meta property="og:url" content="https://mygirlfriendisanartist.com/"> <!-- Replace with the URL of your website -->
  
   <script>
let photos = [];
let currentPhotoIndex = -1;
let photoLoading = false;

async function showPhoto(index) {
  if (photoLoading || photos.length === 0) return;
  photoLoading = true;
  const photo = photos[index];
  const imageElement = new Image();
  imageElement.alt = photo.title || 'Photo by Ana Andersen Santl';
  try {
    await new Promise((resolve, reject) => {
      imageElement.onload = resolve;
      imageElement.onerror = () => reject(new Error('Unable to load photo.'));
      imageElement.src = photo.image.original.url;
    });
    const container = document.getElementById('random-photo');
    container.replaceChildren(imageElement);
    if (photo.title) {
      const titleElement = document.createElement('p');
      titleElement.textContent = photo.title;
      container.appendChild(titleElement);
    }
    currentPhotoIndex = index;
  } catch (error) {
    console.error(error);
  } finally {
    photoLoading = false;
  }
}

function nextPhoto() {
  return showPhoto((currentPhotoIndex + 1) % photos.length);
}

async function initializePhotos() {
  const container = document.getElementById('random-photo');
  container.addEventListener('click', nextPhoto);
  container.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      nextPhoto();
    }
  });
  try {
    const contents = [];
    const perPage = 100;
    let page = 1;
    while (true) {
      const response = await fetch(
        `https://api.are.na/v2/channels/my-girlfriend-is-an-artist/contents?page=${page}&per=${perPage}`
      );
      if (!response.ok) throw new Error('Unable to load the Are.na channel.');
      const data = await response.json();
      const blocks = data.contents || [];
      contents.push(...blocks);
      if (blocks.length < perPage ||
          (typeof data.length === 'number' && contents.length >= data.length)) break;
      page += 1;
    }
    photos = contents.filter(block =>
      block.class === 'Image' && block.image?.original?.url
    ).reverse();
    if (photos.length === 0) throw new Error('No images found in the channel.');
    await showPhoto(0);
  } catch (error) {
    console.error(error);
  }
}

window.addEventListener('DOMContentLoaded', initializePhotos);
</script>
</head>
  <!-- Your HTML content here -->
  <body>
  <!-- Container for displaying the random photo -->
    <a id="random-photo" class="image-container" role="button" tabindex="0" aria-label="Show next photo"></a>
  <!-- Anchor element for the question mark icon -->
  <a href="https://www.are.na/kristoffer-tjalve/my-girlfriend-is-an-artist" target="_blank" class="question-mark">&#63;</a>
  </body>
</html>
